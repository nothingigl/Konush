name: Supabase Keepalive

on:
  schedule:
    # Ping every 3 days at 06:00 UTC to keep free-tier Supabase active
    - cron: '0 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping public.healthcheck via REST API (anon/publishable key only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured yet — skipping keepalive ping."
            exit 0
          fi

          STATUS=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/healthcheck?select=id,status&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${STATUS}"
          cat /tmp/health.json
          echo ""

          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Supabase keepalive ping failed with HTTP ${STATUS}"
            exit 1
          fi
