name: Supabase Keepalive

on:
  schedule:
    # Run every 4 days at 06:00 UTC to keep free-tier Supabase active (pauses after 7 days of inactivity)
    - cron: '0 6 */4 * *'
  workflow_dispatch:

jobs:
  ping-healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase public healthcheck table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is not configured yet — skipping keepalive."
            exit 0
          fi

          HTTP_CODE=$(curl -sS -o /tmp/healthcheck.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/healthcheck?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase healthcheck HTTP status: ${HTTP_CODE}"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Healthcheck ping failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
